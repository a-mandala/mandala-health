name: Docker publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  # Unit tests run as part of the pipeline so publish can depend on them.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest -q

  # Build locally and smoke-test the running container.
  # NEVER pushes: publishing happens only in the `publish` job below,
  # after BOTH test and smoke are green.
  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Compute git version
        id: git-version
        run: |
          VERSION=$(git describe --tags --exact-match 2>/dev/null || echo "${GITHUB_SHA::7}")
          echo "value=$VERSION" >> $GITHUB_OUTPUT
      - name: Build image locally
        run: docker build --build-arg GIT_VERSION=${{ steps.git-version.outputs.value }} -t mandala-health:smoke .
      - name: Start container
        run: docker run -d --name smoke -p 8020:8020 mandala-health:smoke
      - name: Wait for app and smoke /api/today
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8020/api/today; then
              echo; echo "smoke OK"; exit 0
            fi
            sleep 2
          done
          echo "app did not become healthy"; docker logs smoke; exit 1
      - name: Smoke /api/version
        run: |
          VERSION=$(curl -sf http://localhost:8020/api/version)
          echo "$VERSION"
          echo "$VERSION" | grep -q '"version"'
      - name: Smoke search endpoint (Open Food Facts, best-effort)
        # OFF rate-limits/blocks datacenter IPs (GitHub runners) intermittently.
        # This is a live-integration CANARY, not a correctness gate: the app's
        # logic is covered by offline respx tests. Failure here = warning.
        run: |
          for i in 1 2 3; do
            if curl -sf --max-time 20 "http://localhost:8020/api/foods/search?q=nutella" | grep -qi "nutella"; then
              echo "search smoke OK"; exit 0
            fi
            echo "attempt $i failed (likely OFF blocking runner IP), retrying in 10s..."; sleep 10
          done
          echo "::warning::OFF search unreachable from runner (datacenter IP likely rate-limited). Search verified offline by respx tests; verify from your LAN: curl http://<urano>:8020/api/foods/search?q=nutella"
          exit 0

  # Publish happens ONLY after test + smoke are green.
  publish:
    runs-on: ubuntu-latest
    needs: [test, smoke]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Compute git version
        id: git-version
        run: |
          VERSION=$(git describe --tags --exact-match 2>/dev/null || echo "${GITHUB_SHA::7}")
          echo "value=$VERSION" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mandala-health
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_VERSION=${{ steps.git-version.outputs.value }}
