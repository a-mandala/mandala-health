name: Docker publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute git version
        id: git-version
        run: |
          VERSION=$(git describe --tags --exact-match 2>/dev/null || echo "${GITHUB_SHA::7}")
          echo "value=$VERSION" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mandala-health
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Smoke test: avvia il container via compose e verifica che l'app risponda.
  # Protegge da errori runtime (es. ModuleNotFoundError all'avvio) che i test
  # unitari non intercettano.
  smoke:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - name: Build image locally
        run: docker build -t ghcr.io/a-mandala/mandala-health:latest .
      - name: Start stack via compose
        run: docker compose up -d health
      - name: Wait for app and smoke test /api/today
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8020/api/today; then
              echo; echo "smoke OK"; exit 0
            fi
            sleep 2
          done
          echo "app did not become healthy"; docker compose logs health; exit 1
      - name: Smoke test search endpoint (DB auto-seeds on startup)
        run: |
          # No manual 'python -m app.seed_foods': the app must seed data/foods.db
          # itself when the foods table is empty (regression test for empty searchbar).
          curl -sf "http://localhost:8020/api/foods/search?q=banana" | grep -q "Banana"
