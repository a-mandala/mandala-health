services:
  health:
    image: ghcr.io/a-mandala/mandala-health:latest
    container_name: mandala-health
    ports:
      - "8020:8020"
    restart: unless-stopped
    environment:
      # pass-through opzionale (da .env o ambiente host); se assente l'app
      # degrada senza la card workout, il food log locale funziona comunque
      - HEVY_API_KEY=${HEVY_API_KEY:-}
    volumes:
      - ./data:/app/data
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Auto-update: controlla ghcr.io ogni 5 minuti e ricrea il container
  # quando esce una nuova immagine (published automatically by CI on main).
  watchtower:
    image: containrrr/watchtower
    container_name: mandala-health-updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --label-enable --cleanup --api-version 1.44
